# desa: se despliega solo al integrar en la rama desa.
name: gha-desa-insis-db-deploy
on:
  push:
    branches: [desa]
    paths: ["oracle-insis/**"]
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

concurrency:
  group: insis-db-desa
  cancel-in-progress: false

jobs:
  desplegar:
    name: Desplegar
    uses: Fernando-FA/lab-devsecops-pipelines-bd/.github/workflows/bd-desplegar-desa.yml@v2
    secrets: inherit
