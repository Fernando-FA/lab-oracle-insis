# prod: el merge crea la etiqueta prod-v<versión> (la misma de test-v* con el mismo contenido); el Ing. DevSecOps lanza el despliegue con el ticket de Ivanti.
name: gha-prod-insis-db-deploy
on:
  push:
    branches: [prod]
  workflow_dispatch:
    inputs:
      ticket:
        description: Ticket de Ivanti
        required: true

permissions:
  contents: write
  deployments: read

concurrency:
  group: insis-db-prod
  cancel-in-progress: false

jobs:
  etiquetar:
    name: Etiquetar prod-v<versión>
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Crear etiqueta
        run: |
          v=$(scripts/version.sh certificada "$GITHUB_SHA") \
            || { echo "::error::El contenido de prod no corresponde a ninguna etiqueta test-v*: no pasó por test"; exit 1; }
          tag="prod-v$v"
          remoto=$(git ls-remote --tags origin "refs/tags/$tag" | cut -f1)
          if [ -z "$remoto" ]; then
            git tag "$tag" "$GITHUB_SHA" && git push origin "$tag"
            echo "Etiqueta $tag creada en ${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$remoto" = "$GITHUB_SHA" ]; then
            echo "$tag ya apunta a este commit"
          else
            echo "::error::$tag ya existe en otro commit"; exit 1
          fi

  desplegar:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/gha-shared-insis-db-deploy.yml
    with:
      ambiente: prod
      ticket: ${{ inputs.ticket }}
    secrets: inherit
