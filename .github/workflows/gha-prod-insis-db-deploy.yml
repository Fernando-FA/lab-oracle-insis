# prod: el merge crea la etiqueta prod-v<versión> (la misma de test-v* con el mismo contenido); el Ing. DevSecOps lanza el despliegue con el ticket de Ivanti.
name: gha-prod-insis-db-deploy
on:
  push:
    branches: [prod]
  workflow_dispatch:
    inputs:
      ticket:
        description: Ticket de Ivanti
        required: true

permissions:
  contents: write
  deployments: read

concurrency:
  group: insis-db-prod
  cancel-in-progress: false

jobs:
  etiquetar:
    name: Etiquetar
    if: github.event_name == 'push'
    uses: Fernando-FA/lab-devsecops-pipelines-bd/.github/workflows/bd-etiquetar.yml@v2
    with:
      ambiente: prod

  desplegar:
    name: Desplegar
    if: github.event_name == 'workflow_dispatch'
    uses: Fernando-FA/lab-devsecops-pipelines-bd/.github/workflows/bd-desplegar.yml@v2
    with:
      ambiente: prod
      ticket: ${{ inputs.ticket }}
    secrets: inherit
