# Vuelve prod al estado de una etiqueta anterior (prod-v<X.Y.Z>), con ticket de Ivanti y la aprobación de prod.
name: gha-prod-insis-db-rollback
on:
  workflow_dispatch:
    inputs:
      ticket:
        description: Ticket de Ivanti
        required: true
      etiqueta:
        description: Etiqueta a la que se vuelve (prod-vX.Y.Z)
        required: true

permissions:
  contents: read
  deployments: read

concurrency:
  group: insis-db-prod
  cancel-in-progress: false

jobs:
  rollback:
    name: Rollback
    uses: Fernando-FA/lab-devsecops-pipelines-bd/.github/workflows/bd-rollback.yml@v2
    with:
      ticket: ${{ inputs.ticket }}
      etiqueta: ${{ inputs.etiqueta }}
    secrets: inherit
