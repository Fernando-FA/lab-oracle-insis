# Compuerta de los PR a desa, test y prod. La lógica vive en las plantillas de DevSecOps (versión fija).
name: gha-pr-insis-db-validate
on:
  pull_request:
    branches: [desa, test, prod]

permissions:
  contents: read
  deployments: read

jobs:
  compuerta:
    name: Compuerta
    uses: Fernando-FA/lab-devsecops-pipelines-bd/.github/workflows/bd-validar-pr.yml@v1
    secrets: inherit
