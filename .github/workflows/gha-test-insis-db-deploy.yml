# test: el merge crea la etiqueta test-v<versión> (la siguiente: sube el menor); el Ing. DevSecOps lanza el despliegue con el ticket de Ivanti.
name: gha-test-insis-db-deploy
on:
  push:
    branches: [test]
  workflow_dispatch:
    inputs:
      ticket:
        description: Ticket de Ivanti
        required: true

permissions:
  contents: write
  deployments: read

concurrency:
  group: insis-db-test
  cancel-in-progress: false

jobs:
  etiquetar:
    name: Etiquetar
    if: github.event_name == 'push'
    uses: Fernando-FA/lab-devsecops-pipelines-bd/.github/workflows/bd-etiquetar.yml@v1
    with:
      ambiente: test

  desplegar:
    name: Desplegar
    if: github.event_name == 'workflow_dispatch'
    uses: Fernando-FA/lab-devsecops-pipelines-bd/.github/workflows/bd-desplegar.yml@v1
    with:
      ambiente: test
      ticket: ${{ inputs.ticket }}
    secrets: inherit
